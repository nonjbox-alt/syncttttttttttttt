<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SyncRoom Bridge</title>
  <style>
    body{width:300px;margin:0;padding:18px;background:#09090b;color:#f4f4f5;font:14px system-ui,sans-serif}
    h1{font-size:16px;margin:0 0 6px}.muted{color:#a1a1aa;font-size:12px;line-height:1.5}
    button{width:100%;margin-top:12px;border:0;border-radius:10px;padding:11px;background:#38bdf8;color:#082f49;font-weight:800;cursor:pointer}
    button.secondary{background:#27272a;color:#fff}.status{margin-top:14px;padding:10px;border-radius:10px;background:#18181b;font-size:12px}
    .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#71717a;margin-right:7px}.ok .dot{background:#34d399}
  </style>
</head>
<body>
  <h1>SyncRoom Media Bridge</h1>
  <div class="muted">Keep the source on this Firefox device. SyncRoom only sends playback commands.</div>
  <div id="status" class="status"><span class="dot"></span>Checking connection…</div>
  <button id="pair">Use this tab as media source</button>
  <button id="room" class="secondary">Use this tab as SyncRoom</button>
  <script src="popup.js"></script>
</body>
</html>
